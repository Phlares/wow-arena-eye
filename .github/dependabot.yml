# Security updates only: a limit of 0 stops version-update PRs and does
# not apply to security updates. One grouped security PR per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/web"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /analysis
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
